# Local development stack (spec Part 7.5).
# Bring up:  docker compose -f docker-compose.local.yml up
# Postgres, Redis, MinIO (local S3), Flask API (hot-reload), Celery worker.
# The frontend runs separately via `npm run dev` for fastest hot-reload.

services:
  postgres:
    # Postgres 16 with PostGIS (geospatial: where each record was made). Same
    # major version as plain postgres:16, so an existing data volume carries over.
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: rnaf
      POSTGRES_PASSWORD: rnaf
      POSTGRES_DB: rnaf
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rnaf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # MinIO stopped publishing public images (minio/minio and minio/mc on Docker
  # Hub, and quay.io, now refuse pulls). Chainguard's build is the same MinIO
  # server, and it ships `mc` too, so it covers the bucket setup below as well.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  # creates the bucket once MinIO is up
  minio-setup:
    image: cgr.dev/chainguard/minio:latest
    depends_on: [minio]
    environment:
      MC_CONFIG_DIR: /tmp/.mc   # the image runs as a non-root user with no writable home
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 2; done;
      mc mb --ignore-existing local/rnaf-media;
      mc anonymous set download local/rnaf-media;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      target: dev
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://rnaf:rnaf@postgres:5432/rnaf
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    ports: ["5001:5000"]
    volumes: ["./backend:/app"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  celery-worker:
    build:
      context: ./backend
      target: dev
    command: celery -A app.celery_app.celery worker --loglevel=info
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://rnaf:rnaf@postgres:5432/rnaf
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/app"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
  miniodata:
