# Before the first certificate: the whole site on plain HTTP (port 80).
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt fetches a file from here to confirm we control the domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/abhiyudhya/site.conf;
}
