# Once a certificate exists: the site on HTTPS (port 443), and port 80 only
# redirects there. Phones allow GPS and the camera on HTTPS pages only.
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt fetches a file from here when it renews the certificate
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # certbot ... --cert-name abhiyudhya keeps this path the same whatever the domain
    ssl_certificate     /etc/letsencrypt/live/abhiyudhya/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abhiyudhya/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/abhiyudhya/site.conf;
}
