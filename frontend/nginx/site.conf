# The site itself: the React SPA, and /api reverse-proxied to the Flask backend.
# Included by http.conf and https.conf; choose-site.sh picks one at startup.
root /usr/share/nginx/html;
index index.html;

client_max_body_size 20m;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# API -> Gunicorn/Flask container
location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# /health and /health/deep
location /health {
    proxy_pass http://backend:5000/health;
}

# Vite gives every built file under /assets/ a new name whenever it changes,
# so browsers may keep them for a year.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# index.html names those files, so browsers must check it on every visit -
# otherwise a release leaves them asking for files that no longer exist.
location = /index.html {
    expires epoch;
}

# SPA client-side routing: always fall back to index.html
location / {
    try_files $uri $uri/ /index.html;
}
